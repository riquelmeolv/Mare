setInterval(()=>{timerTick();const d=today();if(window.__mareDay!==d){const old=window.__mareDay;window.__mareDay=d;if(old){if(selected===old)selected=d;if(calendarMonth===old.slice(0,7))calendarMonth=d.slice(0,7);render()}}},1000);
window.__mareDay=today();
if(db){db.auth.onAuthStateChange((_evt,session)=>{const next=session?.user||null;if(next?.id!==user?.id){user=next;loaded=false;if(next)setTimeout(()=>loadCloud().catch(err=>{console.error(err);toast('Não foi possível carregar dados: '+err.message)}),0);else render()}});db.auth.getSession().then(({data,error})=>{if(error)throw error;if(!data.session)render()}).catch(e=>{console.error(e);toast('Erro ao verificar sessão: '+e.message);render()})}else render();
</script>
